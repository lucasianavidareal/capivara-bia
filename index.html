<!DOCTYPE html>
<html lang="pt-BR">
<head><script src="https://myhub.ia.br/canvas-vendor/tailwind.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contador de Cliques</title>
</head>
<body class="min-h-screen bg-gradient-to-br from-slate-100 to-blue-50 flex items-center justify-center p-4">
  <div class="bg-white rounded-2xl shadow-lg border border-slate-200 p-8 max-w-sm w-full text-center">
    <p class="text-6xl">🦫</p>
    <h1 class="text-2xl font-bold text-slate-900 mt-2">Contador de Cliques</h1>
    <p class="text-slate-500 text-sm mt-1">Meu primeiro código com IA</p>
    <p id="contador" class="text-6xl font-bold text-blue-600 my-6">0</p>
    <div class="flex gap-3">
      <button id="btnClique" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-xl transition">+1 Clique</button>
      <button id="btnReset" class="px-4 bg-slate-200 hover:bg-slate-300 text-slate-700 font-semibold py-3 rounded-xl transition">Zerar</button>
    </div>
  </div>
  <script>
    let contagem = 0;
    const contadorEl = document.getElementById('contador');
    const btnClique = document.getElementById('btnClique');
    const btnReset = document.getElementById('btnReset');

    function atualizar() {
      contadorEl.textContent = contagem;
    }

    btnClique.addEventListener('click', () => {
      contagem++;
      atualizar();
    });

    btnReset.addEventListener('click', () => {
      contagem = 0;
      atualizar();
    });
  </script>
</body>
</html>
